spring:
  application:
    name: duelyard-backend
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  web:
    error:
      include-stacktrace: never
      include-message: never
  autoconfigure:
    # No in-memory users: authentication will come exclusively from Cognito JWTs (Phase 3).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    # Comma-separated list of origins allowed to call the API (the Next.js frontend).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.duelyard: ${APP_LOG_LEVEL:INFO}
