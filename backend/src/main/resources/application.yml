spring:
  application:
    name: duelyard-backend
  config:
    # Local development: KEY=VALUE settings from backend/.env (gitignored), e.g. written by
    # infra/cognito/setup-cognito.sh. Real environment variables take precedence.
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  web:
    error:
      include-stacktrace: never
      include-message: never
  datasource:
    # Defaults match docker-compose.yml for local development. Production MUST override all three.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/duelyard}
    username: ${DB_USERNAME:duelyard}
    password: ${DB_PASSWORD:duelyard_local}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    # Never lazily load entities while rendering a response; services must return DTOs.
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  autoconfigure:
    # No in-memory users: authentication will come exclusively from Cognito JWTs (Phase 3).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

app:
  cognito:
    region: ${COGNITO_REGION:us-east-1}
    user-pool-id: ${COGNITO_USER_POOL_ID:us-east-1_NOTCONFIGURED}
    # Comma-separated app client ids whose access tokens are accepted.
    client-ids: ${COGNITO_CLIENT_IDS:not-configured}
  realtime:
    ticket-ttl: 30s
    countdown: 5s
    disconnect-grace: 30s
    max-consecutive-timeouts: 3
  matchmaking:
    tick: 1000
  cors:
    # Comma-separated list of origins allowed to call the API (the Next.js frontend).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.duelyard: ${APP_LOG_LEVEL:INFO}
